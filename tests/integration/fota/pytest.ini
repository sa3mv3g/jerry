[pytest]
# Isolate FOTA integration tests from the parent Modbus integration conftest.
# The parent conftest.py imports test_config.py which requires a live register map.
# FOTA tests have their own conftest.py with independent fixtures.
testpaths = .

markers =
    hardware: marks tests that require a live Jerry device
    fota: marks FOTA integration tests
    slow: marks tests as slow (multiple reboots, ~30-40s)
